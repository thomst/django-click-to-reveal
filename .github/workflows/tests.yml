name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            django-version: "Django>=3.2,<3.3"
          - python-version: "3.8"
            django-version: "Django>=4.0,<4.1"
          - python-version: "3.10"
            django-version: "Django>=4.2,<4.3"
          - python-version: "3.12"
            django-version: "Django>=5.2,<5.3"
          - python-version: "3.13"
            django-version: "Django>=6.0,<6.1"
          - python-version: "3.14"
            django-version: "Django>=6.1,<6.2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.django-version }}" "coverage>=7.6.1" .

      - name: Run tests
        run: |
          python -m coverage run --source=click_to_reveal tests/manage.py test testproject
          python -m coverage xml

      - name: Upload coverage
        uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage.xml
          flag-name: python-${{ matrix.python-version }}-${{ strategy.job-index }}
          parallel: true

  test-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run JavaScript tests
        run: node --test tests/click-to-reveal.test.js

  finish:
    needs: [test, test-javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.8
        with:
          parallel-finished: true
