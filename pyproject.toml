[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-click-to-reveal"
dynamic = ["version"]
description = "Reveal email addresses on demand in Django templates."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Thomas Leichtfuß" }]
keywords = ["django", "django-admin", "email", "template-tags"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "Django>=3.2",
]

[project.urls]
Homepage = "https://github.com/thomst/django-click-to-reveal"
Repository = "https://github.com/thomst/django-click-to-reveal"
Issues = "https://github.com/thomst/django-click-to-reveal/issues"

[tool.setuptools]
packages = [
    "click_to_reveal",
    "click_to_reveal.migrations",
    "click_to_reveal.templatetags",
]

[tool.setuptools.package-data]
click_to_reveal = ["templates/click_to_reveal/*.html"]

[tool.setuptools.dynamic]
version = {attr = "click_to_reveal.__version__.__version__"}
